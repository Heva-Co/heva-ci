name: Deploy Cloud Run Service
description: >-
  Generate a Cloud Run service manifest using
  heva-cloudrun-manifest-action, then apply it with
  `gcloud run services replace`.

inputs:
  name:
    description: Cloud Run service name
    required: true
  region:
    description: GCP region to deploy to
    required: true
  image:
    description: "Full image:tag to deploy"
    required: true
  service_account:
    description: Runtime service account email
    required: true
  environment:
    description: >-
      Environment label (dev, stg, prd). When omitted, no environment suffix
      is enforced on the service name.
    required: false
    default: ""
  traffic:
    description: "Traffic policy: 'latest' or 'hold=<revision>'"
    required: false
    default: latest
  port:
    required: false
    default: "8000"
  cpu:
    required: false
    default: "1000m"
  memory:
    required: false
    default: 512Mi
  min_instances:
    required: false
    default: "1"
  max_instances:
    required: false
    default: "10"
  container_concurrency:
    required: false
    default: ""
  timeout:
    required: false
    default: ""
  invoker_iam_disabled:
    required: false
    default: "false"
  vpc_network:
    required: false
    default: ""
  vpc_subnetwork:
    required: false
    default: ""
  vpc_egress:
    required: false
    default: ""
  vpc_tags:
    description: "Network tags, one per line"
    required: false
    default: ""
  cloudsql_instances:
    required: false
    default: ""
  env_plain:
    description: "Plain env vars, one KEY=VALUE per line"
    required: false
    default: ""
  env_secrets:
    description: "Secret env vars, one KEY=secret-name per line"
    required: false
    default: ""
  secret_volumes:
    description: "name:/mount/path=secret-id[:version] per line"
    required: false
    default: ""
  command:
    description: "Entrypoint, one element per line"
    required: false
    default: ""
  args:
    description: "Arguments, one per line"
    required: false
    default: ""
  ingress:
    description: "all | internal | internal-and-cloud-load-balancing"
    required: false
    default: ""
  execution_environment:
    description: "gen1 | gen2"
    required: false
    default: ""
  launch_stage:
    description: "e.g. BETA"
    required: false
    default: ""
  sandbox:
    description: "gvisor"
    required: false
    default: ""
  cpu_throttling:
    description: "true | false"
    required: false
    default: ""
  session_affinity:
    description: "true | false"
    required: false
    default: ""
  custom_audiences:
    description: "One audience per line"
    required: false
    default: ""
  startup_probe:
    description: "path=/health,port=8080,initial-delay=10,timeout=10,period=10,failure-threshold=240"
    required: false
    default: ""
  liveness_probe:
    description: "Same syntax as startup_probe"
    required: false
    default: ""
  readiness_probe:
    description: "Same syntax as startup_probe"
    required: false
    default: ""
  labels:
    description: "k=v per line"
    required: false
    default: ""
  annotations:
    description: "k=v per line, service-level"
    required: false
    default: ""
  template_annotations:
    description: "k=v per line, revision-level. Overrides derived annotations."
    required: false
    default: ""
  overlay:
    description: "Raw YAML, deep-merged last. Escape hatch for anything unmodelled."
    required: false
    default: ""

outputs:
  manifest_path:
    description: Path to the rendered manifest file
    value: ${{ steps.manifest.outputs.manifest-path }}

runs:
  using: composite
  steps:
    - name: Generate service manifest
      id: manifest
      uses: Heva-Co/heva-cloudrun-manifest-action@v0.2.3
      with:
        kind: service
        name: ${{ inputs.name }}
        region: ${{ inputs.region }}
        image: ${{ inputs.image }}
        service-account: ${{ inputs.service_account }}
        environment: ${{ inputs.environment }}
        traffic: ${{ inputs.traffic }}
        port: ${{ inputs.port }}
        cpu: ${{ inputs.cpu }}
        memory: ${{ inputs.memory }}
        min-instances: ${{ inputs.min_instances }}
        max-instances: ${{ inputs.max_instances }}
        concurrency: ${{ inputs.container_concurrency }}
        timeout: ${{ inputs.timeout }}
        invoker-iam-disabled: ${{ inputs.invoker_iam_disabled }}
        vpc-network: ${{ inputs.vpc_network }}
        vpc-subnetwork: ${{ inputs.vpc_subnetwork }}
        vpc-egress: ${{ inputs.vpc_egress }}
        vpc-tags: ${{ inputs.vpc_tags }}
        cloudsql-instances: ${{ inputs.cloudsql_instances }}
        env-plain: ${{ inputs.env_plain }}
        env-secrets: ${{ inputs.env_secrets }}
        secret-volumes: ${{ inputs.secret_volumes }}
        command: ${{ inputs.command }}
        args: ${{ inputs.args }}
        ingress: ${{ inputs.ingress }}
        execution-environment: ${{ inputs.execution_environment }}
        launch-stage: ${{ inputs.launch_stage }}
        sandbox: ${{ inputs.sandbox }}
        cpu-throttling: ${{ inputs.cpu_throttling }}
        session-affinity: ${{ inputs.session_affinity }}
        custom-audiences: ${{ inputs.custom_audiences }}
        startup-probe: ${{ inputs.startup_probe }}
        liveness-probe: ${{ inputs.liveness_probe }}
        readiness-probe: ${{ inputs.readiness_probe }}
        labels: ${{ inputs.labels }}
        annotations: ${{ inputs.annotations }}
        template-annotations: ${{ inputs.template_annotations }}
        overlay: ${{ inputs.overlay }}

    - name: Print rendered manifest
      shell: bash
      run: |
        echo "--- Cloud Run service manifest ---"
        cat "${{ steps.manifest.outputs.manifest-path }}"

    - name: Deploy to Cloud Run
      shell: bash
      run: |
        gcloud run services replace \
          "${{ steps.manifest.outputs.manifest-path }}" \
          --region "${{ inputs.region }}"
